<title>METAR Reader</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 60px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.4rem; }
  input { font-size: 1rem; padding: 8px; text-transform: uppercase; width: 140px; }
  button { font-size: 1rem; padding: 8px 16px; }
  .plain { font-size: 1.2rem; margin: 16px 0; padding: 16px; background: #eef6ff; border-radius: 8px; }
  .raw { font-family: monospace; color: #666; font-size: 0.85rem; }
  .error { color: #b00020; }
</style>

<h1>METAR Reader</h1>
<form>
  <input name="code" placeholder="e.g. KHIO" value="{{ code }}" maxlength="5" autofocus>
  <button type="submit">Get weather</button>
</form>

{% if error %}
  <p class="error">{{ error }}</p>
{% endif %}

{% if result %}
  <p class="plain">{{ result.plain }}</p>
  <p class="raw">{{ result.code }}: {{ result.raw }}</p>
{% endif %}
